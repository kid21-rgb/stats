const getPeriodLabel = (n, numPeriods) => {
  if (numPeriods === 2) return n === 1 ? '1st Half' : '2nd Half';
  if (numPeriods === 4) return `Q${n}`;
  return `P${n}`;
};

const BasketballStatsApp = () => {
  const [screen, setScreen] = useState('home');
  const [games, setGames] = useState([]);
  const [currentGame, setCurrentGame] = useState(null);
  const [currentPeriod, setCurrentPeriod] = useState(1);
  const [gameLog, setGameLog] = useState([]);
  const [filterPeriod, setFilterPeriod] = useState('Total');
  const [lastStat, setLastStat] = useState(null);
  const [toast, setToast] = useState(null);
  const [darkMode, setDarkMode] = useState(true);
  const [shotChartPopup, setShotChartPopup] = useState(null);
  const [viewingShotChart, setViewingShotChart] = useState(null);
  const [shotChartSource, setShotChartSource] = useState('boxScore');
  const [shotChartFilter, setShotChartFilter] = useState('all');
  const [showQuality, setShowQuality] = useState(true);
  const [isEndGameView, setIsEndGameView] = useState(false);
  const [playerOrder, setPlayerOrder] = useState([]);
  const [editingStatIndex, setEditingStatIndex] = useState(null);
  const [insertStatMode, setInsertStatMode] = useState(null); // {index, position: 'above'|'below'}
  const [focusedStatIndex, setFocusedStatIndex] = useState(null);
  const [subModal, setSubModal] = useState(null);
  const [onCourtSet, setOnCourtSet] = useState(new Set());
  const [rotations, setRotations] = useState([]);
  const rotationsRef = useRef([]);
  const currentRotationKeyRef = useRef('');
  const currentRotationHasStatRef = useRef(false);
  const possTeamRef = useRef('us'); // 'us' | 'them'
  const possStartRotKeyRef = useRef('');
  const possStartPlayersRef = useRef(new Set());
  const pendingPossRef = useRef(null); // {type:'ftMade'|'fgMiss', forTeam:'us'|'them'}
  const currentPossPointsRef = useRef(0);
  const onCourtSetRef = useRef(new Set());
  const jumpBallArrowRef = useRef(null); // null=uninitialized, 'us'/'them'=who has arrow next
  const offRebPossessionRef = useRef(null); // 'us'|'them'|null — was there an OffReb in this possession
  const techFTActiveRef = useRef(false);
  const tipOffTimeRef = useRef(null); // ms epoch at tip-off button press — for video sync elapsed display
  const [jumpBallPopup, setJumpBallPopup] = useState(null); // {playerIndex, statType}
  const [oppScoreCategoryPopup, setOppScoreCategoryPopup] = useState(null); // {statType}
  const [ftCategoryPopup, setFtCategoryPopup] = useState(null); // {playerIndex}
  const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);
  const [rotationsAutoDownload, setRotationsAutoDownload] = useState(false);
  const [summaryAutoDownload, setSummaryAutoDownload] = useState(false);
  const [rotationsBackScreen, setRotationsBackScreen] = useState('game');
  const [showMainMenuConfirm, setShowMainMenuConfirm] = useState(false);
  const [boxScoreBackScreen, setBoxScoreBackScreen] = useState('home');
  const [summaryBackScreen, setSummaryBackScreen] = useState('game');
  const [gameLogBackScreen, setGameLogBackScreen] = useState('game');
  const [possTeam, setPossTeam] = useState('us');
  const [lineupConfirmModal, setLineupConfirmModal] = useState(null);
  const [tipOffDone, setTipOffDone] = useState(false);
  const [activeGameSnapshot, setActiveGameSnapshot] = useState(null);
  const [showGlossary, setShowGlossary] = useState(false);
  const [showGameEdit, setShowGameEdit] = useState(false);

  useEffect(() => {
    const loadGames = async () => {
      try {
        const result = await storage.list('game:');
        if (result && result.keys) {
          const loadedGames = await Promise.all(
            result.keys.map(async (key) => {
              const data = await storage.get(key);
              return data ? JSON.parse(data.value) : null;
            })
          );
          setGames(loadedGames.filter(g => g !== null));
        }
      } catch (error) {
        console.log('No previous games found');
      }
    };
    loadGames();
    const loadDarkMode = async () => {
      try {
        const result = await storage.get('darkMode');
        if (result) setDarkMode(JSON.parse(result.value));
      } catch (e) {}
    };
    loadDarkMode();
    const loadActiveGame = async () => {
      try {
        const result = await storage.get('activeGame');
        if (result) setActiveGameSnapshot(JSON.parse(result.value));
      } catch (e) {}
    };
    loadActiveGame();
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2000);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    if (screen !== 'game' || isEndGameView || !currentGame) return;
    const snapshot = {
      game: currentGame,
      gameLog,
      rotations: rotationsRef.current,
      period: currentPeriod,
      onCourt: [...onCourtSet],
      possTeam: possTeamRef.current,
      jumpBallArrow: jumpBallArrowRef.current,
      pendingPoss: pendingPossRef.current,
      tipOffTime: tipOffTimeRef.current,
    };
    storage.set('activeGame', JSON.stringify(snapshot));
  }, [currentGame, gameLog, currentPeriod, screen, isEndGameView]);

  const toggleDarkMode = async () => {
    const newMode = !darkMode;
    setDarkMode(newMode);
    try { await storage.set('darkMode', JSON.stringify(newMode)); } catch (e) {}
  };

  const saveGame = async (game) => {
    await storage.set(`game:${game.id}`, JSON.stringify(game));
  };

  const deleteGame = async (gameId, gameIndex) => {
    await storage.delete(`game:${gameId}`);
    // Remove only the specific instance by index (handles duplicates)
    if (gameIndex !== undefined) {
      setGames(games.filter((_, idx) => idx !== gameIndex));
    } else {
      setGames(games.filter(g => g.id !== gameId));
    }
  };

  const calculateTeamScore = (game) => {
    if (!game || !game.players) return 0;
    return game.players.reduce((total, player) => {
      const stats = player.stats || {};
      return total + (stats['2ptMade'] || 0) * 2 + (stats['3ptMade'] || 0) * 3 + (stats['FTMade'] || 0);
    }, 0);
  };

  const calculateOpponentScore = (game) => {
    if (!game || !game.opponent) return 0;
    const stats = game.opponent.stats || {};
    return (stats['2ptMade'] || 0) * 2 + (stats['3ptMade'] || 0) * 3 + (stats['FTMade'] || 0);
  };

  const calculatePlayerPoints = (player) => {
    const stats = player.stats || {};
    return (stats['2ptMade'] || 0) * 2 + (stats['3ptMade'] || 0) * 3 + (stats['FTMade'] || 0);
  };

  const getPlayerRebounds = (player) => {
    const stats = player.stats || {};
    return (stats['OffReb'] || 0) + (stats['DefReb'] || 0);
  };

  const movePlayerToTop = (playerIdx) => {
    const newOrder = [...playerOrder];
    const currentPos = newOrder.indexOf(playerIdx);
    if (currentPos > 0) {
      newOrder.splice(currentPos, 1);
      newOrder.unshift(playerIdx);

  const movePlayerUp = (playerIdx) => {
    const newOrder = [...playerOrder];
    const currentPos = newOrder.indexOf(playerIdx);

  const toggleLineupConfirmSelection = (idx) => {

    const sortedOnPlayers = [...onPlayers].sort((a, b) => {

  const handleTipOffWinner = (winner) => {

  const startNewGame = (gameInfo) => {

      })),

  const handleGameEdit = ({ teamName, opponentName, location, numPeriods, minutesPerPeriod, players: editedPlayers }) => {
    const oldTeamName = currentGame.teamName;
    const oldOppName = currentGame.opponentName || 'Opponent';
    const newOppName = opponentName || 'Opponent';
    const BLANK_STATS = { '2ptMade':0,'2ptMiss':0,'3ptMade':0,'3ptMiss':0,'FTMade':0,'FTMiss':0,'OffReb':0,'DefReb':0,'Ast':0,'Stl':0,'Blk':0,'LiveTO':0,'DeadTO':0,'Foul':0,'ForceJB':0,'ConcedeJB':0,'plusMinus':0,'poss':0 };

    // Build old-index → new-index map
    const oldToNew = {};
    let nextIdx = 0;
    editedPlayers.forEach(p => { if (p.originalIndex !== undefined) oldToNew[p.originalIndex] = nextIdx++; else nextIdx++; });
    currentGame.players.forEach((_, i) => { if (oldToNew[i] === undefined) oldToNew[i] = -1; });

    // Build final players
    const finalPlayers = editedPlayers.map(p =>
      p.originalIndex !== undefined
        ? { ...currentGame.players[p.originalIndex], number: p.number, name: p.name }
        : { number: p.number, name: p.name, stats: { ...BLANK_STATS }, periodStats: {}, shotChart: [] }
    );

    // Remap game log
    const updatedLog = gameLog.map(entry => {
      let text = (entry.text || '');
      if (teamName !== oldTeamName) text = text.split(oldTeamName).join(teamName);
      if (newOppName !== oldOppName) text = text.split(oldOppName).join(newOppName);
      if (entry.playerIndex === null || entry.playerIndex === 'opponent') return { ...entry, text };
      const ni = oldToNew[entry.playerIndex];
      if (ni === undefined || ni === -1) return null;
      return { ...entry, text, playerIndex: ni };
    }).filter(Boolean);

    // Remap rotations
    const updatedRotations = rotationsRef.current.map(rot => {
      const newPlayers = (rot.players || []).map(i => oldToNew[i]).filter(i => i !== undefined && i !== -1);
      return newPlayers.length ? { ...rot, players: newPlayers } : null;
    }).filter(Boolean);

    // Remap onCourtSet and playerOrder
    const newOnCourt = new Set([...onCourtSet].map(i => oldToNew[i]).filter(i => i !== undefined && i !== -1));
    const remapped = [...playerOrder].map(i => oldToNew[i]).filter(i => i !== undefined && i !== -1);
    const used = new Set(remapped);
    const extras = [...Array(finalPlayers.length).keys()].filter(i => !used.has(i));
    const newPlayerOrder = [...remapped, ...extras];

    const updatedGame = { ...currentGame, teamName, opponentName, location, numPeriods: parseInt(numPeriods)||4, minutesPerPeriod: parseInt(minutesPerPeriod)||10, players: finalPlayers };
    setCurrentGame(updatedGame);
    setGameLog(updatedLog);
    setRotations(updatedRotations);
    rotationsRef.current = updatedRotations;
    setOnCourtSet(newOnCourt);
    onCourtSetRef.current = newOnCourt;
    setPlayerOrder(newPlayerOrder);
    setShowGameEdit(false);
  };

  const handleFieldGoalClick = (playerIndex, statType) => {
    if (playerIndex === 'opponent') {
      if (statType === '2ptMade' || statType === '3ptMade') {
        handleOpponentScore(statType);
      } else {
        recordStat(playerIndex, statType);
      }
      return;
    }
    if (!currentGame.enableShotChart) {
      recordStat(playerIndex, statType);
      return;
    }
    const is2ndChance = offRebPossessionRef.current === 'us';
    setShotChartPopup({ playerIndex, statType, step: 'location', x: null, y: null, is2ndChance });
  };

  const handleCourtClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setShotChartPopup(prev => ({ ...prev, x, y, step: 'quality' }));
  };

  const handleCourtRelocation = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setShotChartPopup(prev => ({ ...prev, x, y }));

  const handleQualitySelect = (quality, category) => {

    player.shotChart = player.shotChart || [];
    player.shotChart.push({ x, y, made: isMade, is3pt: statType.includes('3pt'), quality, category, period: currentPeriod, time: Date.now() });
    setCurrentGame(updatedGame);
    setShotChartPopup(null);
    recordStat(playerIndex, statType, updatedGame, { scoreCategory: category, shotQuality: quality });

  const handleJumpBallClick = (playerIndex, statType) => {

  const handleOpponentScore = (statType) => {

  const confirmOppScoreCategory = (category) => {

    recordStat('opponent', statType, null, { scoreCategory: category });

  const handleFTMade = (playerIndex) => {
    setFtCategoryPopup({ playerIndex });
  };

  const confirmFTCategory = (category) => {

    setFtCategoryPopup(null);
    if (category === 'Technical') {
      recordStat(playerIndex, 'FTMade', null, { scoreCategory: 'Technical', skipPossession: true });
      return;
    }
    recordStat(playerIndex, 'FTMade', null, { scoreCategory: category });
  };

  const commitPossession = (updatedGame) => {
    const rotKey = possStartRotKeyRef.current;
    if (!rotKey) return;
    const isOurPoss = possTeamRef.current === 'us';
    const pts = currentPossPointsRef.current;
    const updRots = [...rotationsRef.current];
    let ri = updRots.findIndex(r => r.key === rotKey);
    if (ri === -1) {
      updRots.push({ key: rotKey, players: rotKey.split(',').map(Number), count: 0, plusMinus: 0, rebDiff: 0, toDiff: 0, teamFGMade: 0, teamFGAtt: 0, oppFGMade: 0, oppFGAtt: 0, offPoss: 0, defPoss: 0, offPoints: 0, defPoints: 0 });
      ri = updRots.length - 1;
    }
    const rot = { ...updRots[ri] };
    if (isOurPoss) { rot.offPoss = (rot.offPoss || 0) + 1; rot.offPoints = (rot.offPoints || 0) + pts; }
    else { rot.defPoss = (rot.defPoss || 0) + 1; rot.defPoints = (rot.defPoints || 0) + pts; }
    updRots[ri] = rot;
    rotationsRef.current = updRots;
    setRotations(updRots);
    // Per-period possession tracking (used by Summary/BoxScore period filter)
    if (!updatedGame.periodPoss) updatedGame.periodPoss = {};
    if (!updatedGame.periodPoss[currentPeriod]) updatedGame.periodPoss[currentPeriod] = { offPoss: 0, defPoss: 0, offPoints: 0, defPoints: 0 };
    if (isOurPoss) { updatedGame.periodPoss[currentPeriod].offPoss++; updatedGame.periodPoss[currentPeriod].offPoints += pts; }
    else { updatedGame.periodPoss[currentPeriod].defPoss++; updatedGame.periodPoss[currentPeriod].defPoints += pts; }
    possStartPlayersRef.current.forEach(idx => {
      if (updatedGame.players[idx]) updatedGame.players[idx].stats.poss = (updatedGame.players[idx].stats.poss || 0) + 1;
    });
  };

  const startPossession = (team) => {
    possTeamRef.current = team;
    setPossTeam(team);
    possStartRotKeyRef.current = currentRotationKeyRef.current;
    possStartPlayersRef.current = new Set(onCourtSetRef.current);
    currentPossPointsRef.current = 0;
    offRebPossessionRef.current = null;
  };

  const processPossession = (isOpponent, statType, updatedGame, skipPossession = false, jbPossTeam = null) => {
    if (skipPossession) {
      if (statType === 'FTMade') currentPossPointsRef.current += 1;
      return;
    }
    // These stats never end a possession — don't touch possession state
    if (statType === 'Blk' || statType === 'Ast' || statType === 'Foul') return;
    const currentTeam = isOpponent ? 'them' : 'us';
    const pending = pendingPossRef.current;
    let pendingResolved = false;

    if (pending) {
      if (pending.type === 'ftMade') {
        if (statType !== 'FTMade' && statType !== 'FTMiss') {
          possTeamRef.current = pending.forTeam; // ensure FT possession credited to scorer, not current ball-holder
          commitPossession(updatedGame);
          pendingPossRef.current = null;
          startPossession(pending.forTeam === 'us' ? 'them' : 'us');
          pendingResolved = true;
        } else if (currentTeam !== pending.forTeam) {
          // Other team shooting FTs — close the previous FT possession before starting theirs
          possTeamRef.current = pending.forTeam; // ensure FT possession credited to scorer
          commitPossession(updatedGame);
          pendingPossRef.current = null;
          startPossession(currentTeam);
          pendingResolved = true;
        }
      } else if (pending.type === 'fgMiss') {
        if (statType === 'OffReb' && currentTeam === pending.forTeam) {
          pendingPossRef.current = null;
          return;
        } else if (currentTeam !== pending.forTeam) {
          commitPossession(updatedGame);
          pendingPossRef.current = null;
          startPossession(currentTeam);
          pendingResolved = true;
        } else {
          pendingPossRef.current = null;
        }
      }
    }

    if (pendingResolved) {
      if (statType === 'FTMade') { currentPossPointsRef.current += 1; pendingPossRef.current = { type: 'ftMade', forTeam: currentTeam }; }
      else if (statType === '2ptMade' || statType === '3ptMade') { currentPossPointsRef.current += statType === '2ptMade' ? 2 : 3; commitPossession(updatedGame); startPossession(currentTeam === 'us' ? 'them' : 'us'); }
      else if (statType === '2ptMiss' || statType === '3ptMiss' || statType === 'FTMiss') { pendingPossRef.current = { type: 'fgMiss', forTeam: currentTeam }; }
      else if (statType === 'LiveTO' || statType === 'DeadTO') { commitPossession(updatedGame); startPossession(currentTeam === 'us' ? 'them' : 'us'); }
    } else {
      if (statType === '2ptMade' || statType === '3ptMade') { currentPossPointsRef.current += statType === '2ptMade' ? 2 : 3; commitPossession(updatedGame); startPossession(currentTeam === 'us' ? 'them' : 'us'); }
      else if (statType === 'FTMade') { currentPossPointsRef.current += 1; pendingPossRef.current = { type: 'ftMade', forTeam: currentTeam }; }
      else if (statType === 'FTMiss') { pendingPossRef.current = { type: 'fgMiss', forTeam: currentTeam }; }
      else if (statType === 'LiveTO' || statType === 'DeadTO') { commitPossession(updatedGame); startPossession(currentTeam === 'us' ? 'them' : 'us'); }
      else if (statType === 'DefReb') { if (possTeamRef.current !== currentTeam) { commitPossession(updatedGame); startPossession(currentTeam); } }
      else if (statType === '2ptMiss' || statType === '3ptMiss') { pendingPossRef.current = { type: 'fgMiss', forTeam: currentTeam }; }
      else if (statType === 'Stl') { commitPossession(updatedGame); startPossession('us'); }
      else if (statType === 'ForceJB' || statType === 'ConcedeJB') { commitPossession(updatedGame); startPossession(jbPossTeam || possTeamRef.current); }
    }
  };

  const recordStat = (playerIndex, statType, gameOverride = null, extras = {}) => {
    let updatedGame = gameOverride ? { ...gameOverride } : { ...currentGame };
    const isOpponent = playerIndex === 'opponent';
    const player = isOpponent ? updatedGame.opponent : updatedGame.players[playerIndex];

    // Auto offensive rebound: if same TEAM had a FG miss immediately before this FG attempt
    let autoOffReb = false;
    if (statType === '2ptMade' || statType === '2ptMiss' || statType === '3ptMade' || statType === '3ptMiss') {
      if (gameLog.length > 0) {
        const lastEntry = gameLog[0];
        const lastWasTeamMiss = isOpponent
          ? (lastEntry.playerIndex === 'opponent' && (lastEntry.statType === '2ptMiss' || lastEntry.statType === '3ptMiss'))
          : (lastEntry.playerIndex !== 'opponent' && (lastEntry.statType === '2ptMiss' || lastEntry.statType === '3ptMiss'));

        if (lastWasTeamMiss) {
          autoOffReb = true;
          player.stats['OffReb'] = (player.stats['OffReb'] || 0) + 1;
          if (!player.periodStats[currentPeriod]) player.periodStats[currentPeriod] = {};
          player.periodStats[currentPeriod]['OffReb'] = (player.periodStats[currentPeriod]['OffReb'] || 0) + 1;
        }
      }
    }

    player.stats[statType] = (player.stats[statType] || 0) + 1;
    if (!player.periodStats[currentPeriod]) player.periodStats[currentPeriod] = {};
    player.periodStats[currentPeriod][statType] = (player.periodStats[currentPeriod][statType] || 0) + 1;
    if (currentPeriod > updatedGame.maxPeriod) updatedGame.maxPeriod = currentPeriod;

    const statLabel = { '2ptMade': '2PT Made', '2ptMiss': '2PT Miss', '3ptMade': '3PT Made', '3ptMiss': '3PT Miss', 'FTMade': 'FT Made', 'FTMiss': 'FT Miss', 'OffReb': 'Off Reb', 'DefReb': 'Def Reb', 'Ast': 'Assist', 'Stl': 'Steal', 'Blk': 'Block', 'LiveTO': 'Live TO', 'DeadTO': 'Dead TO', 'Foul': 'Foul', 'ForceJB': 'Force JB', 'ConcedeJB': 'Concede JB' };
    const playerName = isOpponent ? 'Opponent' : `#${player.number} ${player.name}`;

    let displayText = '';
    if (statType === '2ptMade' || statType === '3ptMade' || statType === 'FTMade') {
      const newTeamScore = calculateTeamScore(updatedGame);
      const newOppScore = calculateOpponentScore(updatedGame);
      const qualityTag = (statType !== 'FTMade' && extras.shotQuality) ? ` [${extras.shotQuality}]` : '';
      displayText = `${playerName} - ${statLabel[statType]} (${calculatePlayerPoints(player)} pts)${qualityTag} | ${updatedGame.teamName} ${newTeamScore}-${newOppScore} ${updatedGame.opponentName || 'Opponent'}`;
    } else if (statType === '2ptMiss' || statType === '3ptMiss') {
      const fgMade = (player.stats['2ptMade'] || 0) + (player.stats['3ptMade'] || 0);
      const fgMiss = (player.stats['2ptMiss'] || 0) + (player.stats['3ptMiss'] || 0);
      const fgPct = fgMade + fgMiss > 0 ? Math.round((fgMade / (fgMade + fgMiss)) * 100) : 0;
      const qualityTag = extras.shotQuality ? ` [${extras.shotQuality}]` : '';
      displayText = `${playerName} - ${statLabel[statType]} (${fgMade}/${fgMade + fgMiss}, ${fgPct}%)${qualityTag}`;
    } else if (statType === 'FTMiss') {
      const ftMade = player.stats['FTMade'] || 0;
      const ftMiss = player.stats['FTMiss'] || 0;
      const ftPct = ftMade + ftMiss > 0 ? Math.round((ftMade / (ftMade + ftMiss)) * 100) : 0;
      displayText = `${playerName} - ${statLabel[statType]} (${ftMade}/${ftMade + ftMiss}, ${ftPct}%)`;
    } else {
      displayText = `${playerName} - ${statLabel[statType]} (${player.stats[statType]})`;
    }
    // Append JB possession info
    if ((statType === 'ForceJB' || statType === 'ConcedeJB') && extras.jbPossTeam !== undefined) {

      setGames(games.map(g => g.id === gameToSave.id ? gameToSave : g));

    setBoxScoreBackScreen('home');

    const gameToSave = { ...currentGame, rotations: rotationsRef.current, gameLog };
    await saveGame(gameToSave);
    await storage.delete('activeGame');
    if (!games.some(g => g.id === gameToSave.id)) setGames([...games, gameToSave]);
    else setGames(games.map(g => g.id === gameToSave.id ? gameToSave : g));
    setActiveGameSnapshot(null);
    setScreen('home');
    setIsEndGameView(false);
  };

    setIsEndGameView(false);

  const exportAllGames = async () => {
    try {
      const result = await storage.list('game:');
      if (!result || !result.keys || result.keys.length === 0) {
        alert('No games to export.');
        return;
      }
      const allGames = await Promise.all(result.keys.map(async k => {
        const d = await storage.get(k);
        return d ? JSON.parse(d.value) : null;
      }));
      const valid = allGames.filter(g => g !== null);
      const blob = new Blob([JSON.stringify(valid, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = `basketball_games_${new Date().toISOString().split('T')[0]}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
    } catch (e) { alert('Export failed: ' + e.message); }
  };

  const exportSingleGame = (game) => {
    try {
      const blob = new Blob([JSON.stringify([game], null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      const opp = game.opponentName || 'Opponent';
      link.download = `${game.date} - ${game.teamName} vs ${opp}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
    } catch (e) { alert('Export failed: ' + e.message); }
  };

  const importGamesFromFile = async (file) => {
    try {
      const text = await file.text();
      const imported = JSON.parse(text);
      if (!Array.isArray(imported)) { alert('Invalid file format.'); return; }
      let added = 0, skipped = 0;
      for (const game of imported) {
        if (!game || !game.id) { skipped++; continue; }
        const existing = await storage.get(`game:${game.id}`);
        if (existing) { skipped++; continue; }
        await storage.set(`game:${game.id}`, JSON.stringify(game));
        setGames(prev => [...prev, game]);
        added++;
      }
      alert(`Import complete: ${added} game(s) added, ${skipped} skipped (already exist or invalid).`);
    } catch (e) { alert('Import failed: ' + e.message); }
  };

          root.unmount();
          container.remove();
          resolve();
        }, 350);
      }

  if (screen === 'rotations') return <RotationsScreen game={currentGame} rotations={rotations} onBack={() => setScreen(rotationsBackScreen)} darkMode={darkMode} theme={theme} autoDownload={rotationsAutoDownload} onAutoDownloadDone={() => setRotationsAutoDownload(false)} isEndGameView={isEndGameView} onStatEntry={() => setScreen('game')} onBoxScore={() => setScreen('boxScore')} onGameLog={() => { setGameLogBackScreen('rotations'); setFocusedStatIndex(null); setScreen('gameLog'); }} onMainMenu={() => { setScreen('home'); setIsEndGameView(false); }} onSummary={() => { setSummaryBackScreen('rotations'); setScreen('summary'); }} onShotChart={currentGame.enableShotChart ? () => { setViewingShotChart({ type: 'team' }); setShotChartSource('rotations'); setScreen('shotChart'); } : null} toggleDarkMode={toggleDarkMode} />;

mary'); }} />;

const GameEditModal = ({ game, onSave, onClose, theme, darkMode }) => {
  const [teamName, setTeamName] = React.useState(game.teamName || '');
  const [opponentName, setOpponentName] = React.useState(game.opponentName || '');
  const [location, setLocation] = React.useState(game.location || '');
  const [numPeriods, setNumPeriods] = React.useState(game.numPeriods || 4);
  const [minutesPerPeriod, setMinutesPerPeriod] = React.useState(game.minutesPerPeriod || 10);
  const [players, setPlayers] = React.useState(
    game.players.map((p, i) => ({ number: p.number, name: p.name, originalIndex: i, hasStats: Object.values(p.stats || {}).some(v => v !== 0) }))
  );

  const addPlayer = () => setPlayers([...players, { number: '', name: '', originalIndex: undefined, hasStats: false }]);
  const removePlayer = (idx) => setPlayers(players.filter((_, i) => i !== idx));
  const updatePlayer = (idx, field, val) => { const u = [...players]; u[idx] = { ...u[idx], [field]: val }; setPlayers(u); };

  const handleSave = () => {
    if (!teamName.trim()) return;
    onSave({ teamName: teamName.trim(), opponentName: opponentName.trim(), location: location.trim(), numPeriods: parseInt(numPeriods) || 4, minutesPerPeriod: parseInt(minutesPerPeriod) || 10, players });
  };

  const inp = `w-full p-2 border rounded text-sm ${theme.inputBg} ${theme.border}`;

  return (
    <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className={`${theme.card} ${theme.text} rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto`} onClick={e => e.stopPropagation()}>
        <div className={`flex items-center justify-between p-4 border-b border-gray-500/30 sticky top-0 z-10 ${theme.card} rounded-t-xl`}>
          <h2 className="text-lg font-bold">Edit Game Info</h2>
          <button onClick={onClose} className="p-1 rounded hover:bg-gray-500/20 text-lg leading-none">✕</button>
        </div>
        <div className="p-4 space-y-3 text-sm">
          <div className="grid grid-cols-2 gap-2">
            <div><label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Team Name</label><input value={teamName} onChange={e => setTeamName(e.target.value)} className={inp} /></div>
            <div><label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Opponent</label><input value={opponentName} onChange={e => setOpponentName(e.target.value)} className={inp} /></div>
          </div>
          <div><label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Location</label><input value={location} onChange={e => setLocation(e.target.value)} className={inp} /></div>
          <div className="grid grid-cols-2 gap-2">
            <div><label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}># of Periods</label><input type="number" min="1" max="8" value={numPeriods} onChange={e => setNumPeriods(e.target.value)} className={inp} /></div>
            <div><label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Mins / Period</label><input type="number" min="1" max="60" value={minutesPerPeriod} onChange={e => setMinutesPerPeriod(e.target.value)} className={inp} /></div>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="font-semibold">Players</span>
              <button onClick={addPlayer} className="bg-green-600 text-white px-2 py-1 rounded text-xs hover:bg-green-700">+ Add Player</button>
            </div>
            <div className="space-y-1.5">
              {players.map((p, idx) => (
                <div key={idx} className="flex gap-2 items-center">
                  <input placeholder="#" value={p.number} onChange={e => updatePlayer(idx, 'number', e.target.value)} className={`w-16 p-2 border rounded text-sm ${theme.inputBg} ${theme.border}`} />
                  <input placeholder="Name" value={p.name} onChange={e => updatePlayer(idx, 'name', e.target.value)} className={`flex-1 p-2 border rounded text-sm ${theme.inputBg} ${theme.border}`} />
                  {p.hasStats && <span className="text-xs text-yellow-500 whitespace-nowrap">has stats</span>}
                  <button onClick={() => removePlayer(idx)} className="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700 flex-shrink-0">✕</button>
                </div>
              ))}
            </div>
          </div>
          <div className="flex gap-2 pt-2">
            <button onClick={handleSave} className="flex-1 bg-orange-600 text-white py-2 rounded font-bold hover:bg-orange-700">Save Changes</button>
            <button onClick={onClose} className="flex-1 bg-gray-600 text-white py-2 rounded hover:bg-gray-700">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const RotationsScreen = ({ game, rotations, onBack, darkMode, theme, autoDownload, onAutoDownloadDone, isEndGameView, onStatEntry, onBoxScore, onGameLog, onMainMenu, onSummary, onShotChart, onCaptureReady, toggleDarkMode }) => {
  const rotationsRef = useRef(null);
  const [showGlossary, setShowGlossary] = React.useState(false);
  const calcScore = (entity) => ((entity.stats?.['2ptMade']||0)*2+(entity.stats?.['3ptMade']||0)*3+(entity.stats?.FTMade||0));
  const teamScore = game.players.reduce((s,p)=>s+calcScore(p),0);
  const oppScore = calcScore(game.opponent);
  const getTotalPoss = (rot) => (rot.offPoss || 0) + (rot.defPoss || 0);
  const sorted = [...rotations].sort((a, b) => getTotalPoss(b) - getTotalPoss(a));
  const getPlayerName = (idx) => { const p = game.players[idx]; return p ? p.name : `Player ${idx}`; };
  const fgPct = (m, a) => a === 0 ? '-' : `${Math.round((m / a) * 100)}% [${m}/${a}]`;
  const signed = (v) => v > 0 ? `+${v}` : `${v}`;
  const signColor = (v) => v > 0 ? 'text-green-500' : v < 0 ? 'text-red-500' : '';

  const exportJPG = async () => {
    if (!rotationsRef.current) return;
    try {
      const canvas = await html2canvas(rotationsRef.current, { backgroundColor: darkMode ? '#1f2937' : '#ffffff', scale: 2 });
      const link = document.createElement('a');
      link.download = `${game.date} - ${game.teamName} vs ${game.opponentName || 'Opponent'} - Rotations.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    } catch (e) { console.error('Export failed:', e); }
  };

  const getORate = (rot) => rot.offPoss > 0 ? Math.round(100 * (rot.offPoints || 0) / rot.offPoss) : '-';
  const getDRate = (rot) => rot.defPoss > 0 ? Math.round(100 * (rot.defPoints || 0) / rot.defPoss) : '-';
  const getNetRate = (rot) => {
    if (!rot.offPoss || !rot.defPoss) return '-';
    return Math.round((100 * (rot.offPoints || 0) / rot.offPoss) - (100 * (rot.defPoints || 0) / rot.defPoss));
  };

  const exportCSV = () => {
    const headers = ['Lineup', 'OffPoss', 'DefPoss', 'TotalPoss', 'ORate', 'DRate', 'NetRate', 'PTS+/-', 'REB±', 'TO±', 'Team FGM', 'Team FGA', 'Team FG%', 'Opp FGM', 'Opp FGA', 'Opp FG%'];
    const rows = [`${game.teamName} — Rotations`, `${game.date}`, '', headers.join(',')];
    sorted.forEach((rot) => {
      const lineup = rot.players.map(i => { const p = game.players[i]; return p ? `#${p.number} ${p.name}` : `Player ${i}`; }).join(' / ');
      const netRate = getNetRate(rot);
      rows.push([
        `"${lineup}"`,
        rot.offPoss || 0,
        rot.defPoss || 0,
        getTotalPoss(rot),
        getORate(rot),
        getDRate(rot),
        netRate !== '-' && netRate > 0 ? `+${netRate}` : netRate,
        rot.plusMinus >= 0 ? `+${rot.plusMinus}` : rot.plusMinus,
        rot.rebDiff >= 0 ? `+${rot.rebDiff}` : rot.rebDiff,
        rot.toDiff >= 0 ? `+${rot.toDiff}` : rot.toDiff,
        rot.teamFGMade || 0,
        rot.teamFGAtt || 0,
        `"${fgPct(rot.teamFGMade, rot.teamFGAtt)}"`,
        rot.oppFGMade || 0,
        rot.oppFGAtt || 0,
        `"${fgPct(rot.oppFGMade, rot.oppFGAtt)}"`,
      ].join(','));
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const link = document.createElement('a');
    link.download = `${game.date} - ${game.teamName} vs ${game.opponentName || 'Opponent'} - Rotations.csv`;
    link.href = URL.createObjectURL(blob);
    link.click();
  };

  useEffect(() => {
    if (autoDownload) {
      const timer = setTimeout(() => {
        exportJPG().then(() => {
          if (onAutoDownloadDone) onAutoDownloadDone();
        });
      }, 200);
      return () => clearTimeout(timer);
    }
  }, [autoDownload]);

  return (
    <div className={`min-h-screen ${theme.bg} ${theme.text} p-2 sm:p-4 max-w-6xl mx-auto`}>
      <GameHeader
        game={game} darkMode={darkMode} theme={theme}
        currentScreen="rotations"
        teamScore={teamScore} oppScore={oppScore}
        periodLabel={isEndGameView ? 'Final' : getPeriodLabel(game.maxPeriod||1, game.numPeriods)}
        toggleDarkMode={toggleDarkMode}
        onShowGlossary={() => setShowGlossary(true)}
        onConfirmHome={onMainMenu}
        onStatEntry={isEndGameView ? null : onStatEntry}
        onBoxScore={onBoxScore}
        onRotations={null}
        onShotChart={onShotChart}
        onGameLog={onGameLog}
        onSummary={onSummary}
        enableShotChart={game.enableShotChart}
        rightActions={
          <div className="flex gap-1">
            <button onClick={exportJPG} className="bg-blue-600 text-white px-2 py-2 rounded hover:bg-blue-700 flex items-center gap-0.5 text-xs whitespace-nowrap"><Download size={13} /> JPG</button>
            <button onClick={exportCSV} className="bg-green-600 text-white px-2 py-2 rounded hover:bg-green-700 flex items-center gap-0.5 text-xs whitespace-nowrap"><Download size={13} /> CSV</button>
          </div>
        }
      />
      <div ref={el => { rotationsRef.current = el; if (onCaptureReady) onCaptureReady(el); }} className={`${theme.card} rounded-lg shadow-lg p-4`}>
        <h2 className="text-xl font-bold mb-1 text-center">Rotations — {game.teamName} v {game.opponentName || 'Opponent'}</h2>
        <p className={`text-sm ${theme.textMuted} mb-4 text-center`}>{game.date} @ {game.location || 'N/A'}</p>
        {sorted.length === 0 ? (
          <p className={theme.textMuted}>No rotations tracked yet. Record stats during the game to populate this list.</p>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr className={darkMode ? 'bg-gray-700' : 'bg-gray-100'}>
                  <th className="p-2 text-left">Lineup</th>
                  <th className="p-2 text-center">Poss</th>
                  <th className="p-2 text-center">ORate</th>
                  <th className="p-2 text-center">DRate</th>
                  <th className="p-2 text-center">NetRate</th>
                  <th className="p-2 text-center">PTS+/-</th>
                  <th className="p-2 text-center">REB±</th>
                  <th className="p-2 text-center">TO±</th>
                  <th className="p-2 text-center">FG%</th>
                  <th className="p-2 text-center">Opp FG%</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((rot, idx) => {
                  const rowBg = idx % 2 === 1 ? (darkMode ? 'bg-gray-700/50' : 'bg-gray-50') : '';
                  const netRate = getNetRate(rot);
                  const netRateNum = netRate !== '-' ? parseFloat(netRate) : null;
                  return (
                    <tr key={rot.key} className={`border-b ${theme.border} ${rowBg}`}>
                      <td className="p-2 text-xs">{rot.players.map((pi, i) => (i > 0 ? ' / ' : '') + getPlayerName(pi)).join('')}</td>
                      <td className="p-2 text-center">{getTotalPoss(rot)}</td>
                      <td className="p-2 text-center">{getORate(rot)}</td>
                      <td className="p-2 text-center">{getDRate(rot)}</td>
                      <td className={`p-2 text-center font-bold ${netRateNum !== null ? (netRateNum > 0 ? 'text-green-500' : netRateNum < 0 ? 'text-red-500' : '') : ''}`}>{netRate !== '-' && netRateNum > 0 ? '+' : ''}{netRate}</td>
                      <td className={`p-2 text-center font-bold ${signColor(rot.plusMinus)}`}>{signed(rot.plusMinus)}</td>
                      <td className={`p-2 text-center font-bold ${signColor(rot.rebDiff)}`}>{signed(rot.rebDiff)}</td>
                      <td className={`p-2 text-center font-bold ${signColor(rot.toDiff)}`}>{signed(rot.toDiff)}</td>
                      <td className="p-2 text-center">{fgPct(rot.teamFGMade, rot.teamFGAtt)}</td>
                      <td className="p-2 text-center">{fgPct(rot.oppFGMade, rot.oppFGAtt)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showGlossary && <GlossaryModal theme={theme} onClose={() => setShowGlossary(false)} />}
    </div>
  );
};

const GameSetup = ({ onStart, onBack, games, darkMode, theme }) => {
  const [teamName, setTeamName] = useState('');
  const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
  const [opponent, setOpponent] = useState('');
  const [location, setLocation] = useState('');
  const [players, setPlayers] = useState([{ number: '', name: '' }]);
  const [importGameId, setImportGameId] = useState('');
  const [enableShotChart, setEnableShotChart] = useState(true);
  const [numPeriods, setNumPeriods] = useState(4);
  const [minutesPerPeriod, setMinutesPerPeriod] = useState(10);

  const addPlayer = () => setPlayers([...players, { number: '', name: '' }]);
  const updatePlayer = (idx, field, value) => { const updated = [...players]; updated[idx][field] = value; setPlayers(updated); };
  const removePlayer = (idx) => { if (players.length > 1) setPlayers(players.filter((_, i) => i !== idx)); };
  const importPlayers = () => {
    const game = games.find(g => g.id === parseInt(importGameId));
    if (!game) return;
    setPlayers(game.players.map(p => ({ number: p.number, name: p.name })));
    if (!teamName) {
      if (game.teamName) setTeamName(game.teamName);
      if (game.numPeriods) setNumPeriods(game.numPeriods);
      if (game.minutesPerPeriod) setMinutesPerPeriod(game.minutesPerPeriod);
    }
  };
  const handleStart = () => { if (teamName && opponent && players.some(p => p.number && p.name)) onStart({ teamName, date, opponent, location, players: players.filter(p => p.number && p.name), enableShotChart, numPeriods: parseInt(numPeriods) || 4, minutesPerPeriod: parseInt(minutesPerPeriod) || 10 }); };

  return (
    <div className={`min-h-screen ${theme.bg} ${theme.text} p-4 max-w-2xl mx-auto`}>
      <button onClick={onBack} className="mb-4 flex items-center gap-2 text-blue-500 hover:text-blue-400"><ArrowLeft size={20} /> Back</button>
      <div className={`${theme.card} rounded-lg shadow-lg p-4 sm:p-6 space-y-4`}>
        <h2 className="text-2xl font-bold">New Game Setup</h2>
        <input type="text" placeholder="Team Name" value={teamName} onChange={(e) => setTeamName(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
        <input type="text" placeholder="Opponent" value={opponent} onChange={(e) => setOpponent(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
        <input type="text" placeholder="Location" value={location} onChange={(e) => setLocation(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
        <div className="flex gap-3">
          <div className="flex-1">
            <label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Number of Periods</label>
            <input type="number" min="1" max="8" value={numPeriods} onChange={(e) => setNumPeriods(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
          </div>
          <div className="flex-1">
            <label className={`block text-xs font-medium mb-1 ${theme.textMuted}`}>Minutes per Period</label>
            <input type="number" min="1" max="60" value={minutesPerPeriod} onChange={(e) => setMinutesPerPeriod(e.target.value)} className={`w-full p-3 border rounded ${theme.inputBg} ${theme.border}`} />
          </div>
        </div>
        <label className="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" checked={enableShotChart} onChange={(e) => setEnableShotChart(e.target.checked)} className="w-5 h-5 accent-orange-500" />
          <span>Enable Shot Chart Tracking</span>
        </label>
        {games.length > 0 && (
          <div className="flex gap-2">
            <select value={importGameId} onChange={(e) => setImportGameId(e.target.value)} className={`flex-1 p-3 border rounded ${theme.inputBg} ${theme.border}`}>
              <option value="">Import players from previous game...</option>
              {[...games].sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : b.id - a.id)).map(g => <option key={g.id} value={g.id}>{g.teamName} vs {g.opponentName || 'Unknown'} ({g.date})</option>)}
            </select>
            <button onClick={importPlayers} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Import</button>
          </div>
        )}
        <h3 className="text-xl font-bold mt-4">Players</h3>
        {players.map((p, idx) => (
          <div key={idx} className="flex gap-2">
            <input type="text" placeholder="#" value={p.number} onChange={(e) => updatePlayer(idx, 'number', e.target.value)} className={`w-20 p-3 border rounded ${theme.inputBg} ${theme.border}`} />
            <input type="text" placeholder="Player Name" value={p.name} onChange={(e) => updatePlayer(idx, 'name', e.target.value)} className={`flex-1 p-3 border rounded ${theme.inputBg} ${theme.border}`} />
            {players.length > 1 && <button onClick={() => removePlayer(idx)} className="bg-red-500 text-white px-3 rounded hover:bg-red-600"><X size={18} /></button>}
          </div>
        ))}
        <button onClick={addPlayer} className={`w-full ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'} px-4 py-3 rounded`}>+ Add Player</button>
        <button onClick={handleStart} className="w-full bg-orange-600 text-white px-6 py-4 rounded-lg text-lg font-bold hover:bg-orange-700">Start Game</button>
      </div>
    </div>
  );
};

const BoxScore = ({ game, onBack, onMainMenu, filterPeriod, setFilterPeriod, darkMode, theme, onViewShotChart, toggleDarkMode, isEndGameView, calculatePlayerPoints, getPlayerRebounds, gameLog, rotations = [], onViewRotations, onDownloadRotationsJPG, onDownloadSummaryJPG, onResumeGame, onStatEntry, onGameLog, onSummary }) => {
  const boxScoreRef = useRef(null);
  const shotChartRef = useRef(null);
  const [showGlossary, setShowGlossary] = React.useState(false);
  const [showDownloads, setShowDownloads] = React.useState(false);
  const getFilteredStats = (entity) => filterPeriod === 'Total' ? entity.stats || {} : entity.periodStats?.[parseInt(filterPeriod)] || {};

  const calculateTeamTotals = () => {
    const totals = {};
    game.players.forEach(player => {
      const stats = getFilteredStats(player);
      Object.keys(stats).forEach(key => { totals[key] = (totals[key] || 0) + (stats[key] || 0); });
    });
    return totals;
  };

  const formatShooting = (made, missed) => {
    const total = made + missed;
    if (total === 0) return '';
    return `${made}/${total} (${Math.round((made / total) * 100)}%)`;
  };

  const getSortedPlayers = () => {
    if (!isEndGameView) return game.players.map((p, idx) => ({ ...p, originalIndex: idx }));
    return game.players.map((p, idx) => ({ ...p, originalIndex: idx })).sort((a, b) => {
      const aPoints = calculatePlayerPoints(a);
      const bPoints = calculatePlayerPoints(b);
      if (bPoints !== aPoints) return bPoints - aPoints;
      const aReb = getPlayerRebounds(a);
      const bReb = getPlayerRebounds(b);
      if (bReb !== aReb) return bReb - aReb;
      const aAst = a.stats?.Ast || 0;
      const bAst = b.stats?.Ast || 0;
      return bAst - aAst;
    });
  };

  const sortedPlayers = getSortedPlayers();
  const teamTotals = calculateTeamTotals();
  const opponentStats = getFilteredStats(game.opponent);
  const teamScore = (teamTotals['2ptMade'] || 0) * 2 + (teamTotals['3ptMade'] || 0) * 3 + (teamTotals['FTMade'] || 0);
  const oppScore = (opponentStats['2ptMade'] || 0) * 2 + (opponentStats['3ptMade'] || 0) * 3 + (opponentStats['FTMade'] || 0);
  const periods = []; for (let i = 1; i <= (game.maxPeriod || 1); i++) periods.push(i);
  const opponentName = game.opponentName || 'Opponent';

  const getPlayerRatings = (originalIndex) => {
    if (filterPeriod !== 'Total') {
      // Reconstruct from game log for the specific period
      const period = parseInt(filterPeriod);
      if (!gameLog || gameLog.length === 0) return { oRate: null, dRate: null, poss: 0 };
      let ourFGA = 0, oppFGA = 0, ourTO = 0, oppTO = 0, ourPts = 0, oppPts = 0;
      gameLog.forEach(entry => {
        if (entry.period !== period) return;
        if (!entry.rotKey) return;
        const players = entry.rotKey.split(',').map(Number);
        if (!players.includes(originalIndex)) return;
        const d = entry.rotDeltas;
        if (d) {
          ourFGA += d.rTFGA || 0;
          oppFGA += d.rOFGA || 0;
          if ((d.rTo || 0) < 0) ourTO += 1;
          if ((d.rTo || 0) > 0) oppTO += 1;
        }
        if (entry.pmDelta) {
          if (entry.pmDelta > 0) ourPts += entry.pmDelta;
          else oppPts += Math.abs(entry.pmDelta);
        }
      });
      const ourPoss = ourFGA + ourTO;
      const oppPoss = oppFGA + oppTO;
      return {
        oRate: ourPoss > 0 ? Math.round(ourPts / ourPoss * 100) : null,
        dRate: oppPoss > 0 ? Math.round(oppPts / oppPoss * 100) : null,
        poss: ourPoss + oppPoss,
      };
    }
    // Total: use rotations data
    if (!rotations || rotations.length === 0) return { oRate: null, dRate: null, poss: game.players[originalIndex]?.stats?.poss || 0 };
    let offPts = 0, defPts = 0, offPoss = 0, defPoss = 0;
    rotations.forEach(rot => {
      if (rot.players.includes(originalIndex)) {
        offPts += rot.offPoints || 0;
        defPts += rot.defPoints || 0;
        offPoss += rot.offPoss || 0;
        defPoss += rot.defPoss || 0;
      }
    });
    return {
      oRate: offPoss > 0 ? Math.round(offPts / offPoss * 100) : null,
      dRate: defPoss > 0 ? Math.round(defPts / defPoss * 100) : null,
      poss: offPoss + defPoss,
    };
  };

  const getPeriodPlusMinus = (originalIndex) => {
    if (filterPeriod === 'Total') return game.players[originalIndex]?.stats?.plusMinus || 0;
    if (!gameLog || gameLog.length === 0) return 0;
    return gameLog.reduce((sum, entry) => {
      if (entry.pmDelta && entry.pmPlayers && entry.period === parseInt(filterPeriod)) {
        if (entry.pmPlayers.includes(originalIndex)) return sum + entry.pmDelta;
      }
      return sum;
    }, 0);
  };

  const getFilenameBase = () => `${game.date} - ${game.teamName} vs ${opponentName}`;

  const qualityLabel = (q) => {
    if (q === 'A' || q === 1) return 'A';
    if (q === 'B' || q === 2) return 'B';
    if (q === 'C' || q === 3) return 'C';
    return q;
  };

  const getAllTeamShots = () => game.players.flatMap((p, idx) => (p.shotChart || []).map(shot => ({ ...shot, playerIndex: idx, playerName: `#${p.number} ${p.name}` })));
  const allShots = getAllTeamShots();
  const madeCount = allShots.filter(s => s.made).length;
  const missedCount = allShots.filter(s => !s.made).length;
  const fgPct = madeCount + missedCount > 0 ? Math.round((madeCount / (madeCount + missedCount)) * 100) : 0;

  const exportBoxScoreJPG = async () => {
    if (!boxScoreRef.current) return;
    try {
      const canvas = await html2canvas(boxScoreRef.current, { backgroundColor: darkMode ? '#1f2937' : '#ffffff', scale: 2 });
      const link = document.createElement('a');
      link.download = `${getFilenameBase()} - Box Score.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    } catch (e) { console.error('Export failed:', e); }
  };

  const exportBoxScoreCSV = () => {
    const getQualityStr = (shots, q) => {
      const qShots = shots.filter(s => qualityLabel(s.quality) === q);
      const qMade = qShots.filter(s => s.made).length;
      const qPct = qShots.length > 0 ? Math.round((qMade / qShots.length) * 100) : 0;
      return `${q}: ${qMade}/${qShots.length} ${qPct}%`;
    };

    const headers = ['Player', 'FGM', 'FGA', 'FG%', '3ptM', '3PTA', '3P%', 'FTM', 'FTA', 'FT%', 'OREB', 'DREB', 'AST', 'STL', 'BLK', 'LTO', 'DTO', 'FJB', 'CJB', 'PF', 'PTS', '+/-', 'Quality A', 'Quality B', 'Quality C'];
    const rows = [`${game.teamName} v ${opponentName} - Box Score`, `${game.date} @ ${game.location || 'N/A'}`, '', headers.join(',')];

    sortedPlayers.forEach(player => {
      const stats = getFilteredStats(player);
      const fgMade = (stats['2ptMade'] || 0) + (stats['3ptMade'] || 0);
      const fgMiss = (stats['2ptMiss'] || 0) + (stats['3ptMiss'] || 0);
      const fgPct = fgMade + fgMiss > 0 ? Math.round((fgMade / (fgMade + fgMiss)) * 100) : 0;
      const threePct = (stats['3ptMade'] || 0) + (stats['3ptMiss'] || 0) > 0 ? Math.round(((stats['3ptMade'] || 0) / ((stats['3ptMade'] || 0) + (stats['3ptMiss'] || 0))) * 100) : 0;
      const ftPct = (stats['FTMade'] || 0) + (stats['FTMiss'] || 0) > 0 ? Math.round(((stats['FTMade'] || 0) / ((stats['FTMade'] || 0) + (stats['FTMiss'] || 0))) * 100) : 0;
      const points = (stats['2ptMade'] || 0) * 2 + (stats['3ptMade'] || 0) * 3 + (stats['FTMade'] || 0);
      const playerShots = player.shotChart || [];
      rows.push([
        `"#${player.number} ${player.name}"`, fgMade, fgMade + fgMiss, `${fgPct}%`,
        stats['3ptMade'] || 0, (stats['3ptMade'] || 0) + (stats['3ptMiss'] || 0), `${threePct}%`,
        stats['FTMade'] || 0, (stats['FTMade'] || 0) + (stats['FTMiss'] || 0), `${ftPct}%`,
        stats['OffReb'] || 0, stats['DefReb'] || 0, stats['Ast'] || 0, stats['Stl'] || 0, stats['Blk'] || 0,
        stats['LiveTO'] || 0, stats['DeadTO'] || 0, stats['ForceJB'] || 0, stats['ConcedeJB'] || 0, stats['Foul'] || 0, points, player.stats?.plusMinus || 0,
        `"${getQualityStr(playerShots, 'A')}"`, `"${getQualityStr(playerShots, 'B')}"`, `"${getQualityStr(playerShots, 'C')}"`
      ].join(','));
    });

    // Team totals
    const tfgMade = (teamTotals['2ptMade'] || 0) + (teamTotals['3ptMade'] || 0);
    const tfgMiss = (teamTotals['2ptMiss'] || 0) + (teamTotals['3ptMiss'] || 0);
    const tfgPct = tfgMade + tfgMiss > 0 ? Math.round((tfgMade / (tfgMade + tfgMiss)) * 100) : 0;
    const t3Pct = (teamTotals['3ptMade'] || 0) + (teamTotals['3ptMiss'] || 0) > 0 ? Math.round(((teamTotals['3ptMade'] || 0) / ((teamTotals['3ptMade'] || 0) + (teamTotals['3ptMiss'] || 0))) * 100) : 0;
    const tftPct = (teamTotals['FTMade'] || 0) + (teamTotals['FTMiss'] || 0) > 0 ? Math.round(((teamTotals['FTMade'] || 0) / ((teamTotals['FTMade'] || 0) + (teamTotals['FTMiss'] || 0))) * 100) : 0;
    rows.push([
      '"TEAM"', tfgMade, tfgMade + tfgMiss, `${tfgPct}%`,
      teamTotals['3ptMade'] || 0, (teamTotals['3ptMade'] || 0) + (teamTotals['3ptMiss'] || 0), `${t3Pct}%`,
      teamTotals['FTMade'] || 0, (teamTotals['FTMade'] || 0) + (teamTotals['FTMiss'] || 0), `${tftPct}%`,
      teamTotals['OffReb'] || 0, teamTotals['DefReb'] || 0, teamTotals['Ast'] || 0, teamTotals['Stl'] || 0, teamTotals['Blk'] || 0,
      teamTotals['LiveTO'] || 0, teamTotals['DeadTO'] || 0, teamTotals['ForceJB'] || 0, teamTotals['ConcedeJB'] || 0, teamTotals['Foul'] || 0, teamScore,
      `"${getQualityStr(allShots, 'A')}"`, `"${getQualityStr(allShots, 'B')}"`, `"${getQualityStr(allShots, 'C')}"`
    ].join(','));

    // Opponent
    const ofgMade = (opponentStats['2ptMade'] || 0) + (opponentStats['3ptMade'] || 0);
    const ofgMiss = (opponentStats['2ptMiss'] || 0) + (opponentStats['3ptMiss'] || 0);
    const ofgPct = ofgMade + ofgMiss > 0 ? Math.round((ofgMade / (ofgMade + ofgMiss)) * 100) : 0;
    const o3Pct = (opponentStats['3ptMade'] || 0) + (opponentStats['3ptMiss'] || 0) > 0 ? Math.round(((opponentStats['3ptMade'] || 0) / ((opponentStats['3ptMade'] || 0) + (opponentStats['3ptMiss'] || 0))) * 100) : 0;
    const oftPct = (opponentStats['FTMade'] || 0) + (opponentStats['FTMiss'] || 0) > 0 ? Math.round(((opponentStats['FTMade'] || 0) / ((opponentStats['FTMade'] || 0) + (opponentStats['FTMiss'] || 0))) * 100) : 0;
    rows.push([
      '"OPPONENT"', ofgMade, ofgMade + ofgMiss, `${ofgPct}%`,
      opponentStats['3ptMade'] || 0, (opponentStats['3ptMade'] || 0) + (opponentStats['3ptMiss'] || 0), `${o3Pct}%`,
      opponentStats['FTMade'] || 0, (opponentStats['FTMade'] || 0) + (opponentStats['FTMiss'] || 0), `${oftPct}%`,
      opponentStats['OffReb'] || 0, opponentStats['DefReb'] || 0, opponentStats['Ast'] || 0, opponentStats['Stl'] || 0, opponentStats['Blk'] || 0,
      opponentStats['LiveTO'] || 0, opponentStats['DeadTO'] || 0, opponentStats['ForceJB'] || 0, opponentStats['ConcedeJB'] || 0, opponentStats['Foul'] || 0, oppScore,
      '""', '""', '""'
    ].join(','));

    // Rotations tab
    if (rotations && rotations.length > 0) {
      rows.push('', '', '--- ROTATIONS ---', '');
      rows.push(['Lineup', 'Count', '+/-', 'REB±', 'TO±', 'Team FG%', 'Opp FG%'].join(','));
      const rotFgPct = (m, a) => a === 0 ? '-' : `${Math.round((m / a) * 100)}% [${m}/${a}]`;
      [...rotations].sort((a, b) => b.plusMinus - a.plusMinus).forEach(rot => {
        const lineup = rot.players.map(i => { const p = game.players[i]; return p ? p.name : `Player ${i}`; }).join(' / ');
        const pm = rot.plusMinus >= 0 ? `+${rot.plusMinus}` : `${rot.plusMinus}`;
        const reb = rot.rebDiff >= 0 ? `+${rot.rebDiff}` : `${rot.rebDiff}`;
        const to = rot.toDiff >= 0 ? `+${rot.toDiff}` : `${rot.toDiff}`;
        rows.push([`"${lineup}"`, rot.count, pm, reb, to, `"${rotFgPct(rot.teamFGMade, rot.teamFGAtt)}"`, `"${rotFgPct(rot.oppFGMade, rot.oppFGAtt)}"`].join(','));
      });
    }

    // Game Log section
    if (gameLog && gameLog.length > 0) {
      rows.push('', '', '--- GAME LOG ---', '');
      rows.push(['Period', 'Entry'].join(','));
      [...gameLog].reverse().forEach(entry => {
        rows.push([`"Q${entry.period}"`, `"${(entry.text || '').replace(/"/g, '""')}"`].join(','));
      });
    }

    const csv = rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.download = `${getFilenameBase()} - Box Score.csv`;
    link.href = URL.createObjectURL(blob);
    link.click();
  };

  const exportShotChartJPG = async () => {
    if (!shotChartRef.current) return;
    try {
      const canvas = await html2canvas(shotChartRef.current, { backgroundColor: darkMode ? '#1f2937' : '#ffffff', scale: 2 });
      const link = document.createElement('a');
      link.download = `${getFilenameBase()} - Shot Chart.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    } catch (e) { console.error('Export failed:', e); }
  };

  return (
    <div className={`min-h-screen ${theme.bg} ${theme.text} p-4 max-w-6xl mx-auto`}>
      <GameHeader
        game={game} darkMode={darkMode} theme={theme}
        currentScreen="boxScore"
        teamScore={teamScore} oppScore={oppScore}
        periodLabel={filterPeriod !== 'Total' ? getPeriodLabel(parseInt(filterPeriod), game.numPeriods) : isEndGameView ? 'Final' : getPeriodLabel(game.maxPeriod||1, game.numPeriods)}
        toggleDarkMode={toggleDarkMode}
        onShowGlossary={() => setShowGlossary(true)}
        onConfirmHome={onMainMenu}
        onStatEntry={isEndGameView ? onResumeGame : onStatEntry}
        onBoxScore={null}
        onRotations={onViewRotations}
        onShotChart={game.enableShotChart ? () => onViewShotChart('team') : null}
        onGameLog={onGameLog}
        onSummary={onSummary}
        enableShotChart={game.enableShotChart}
        rightActions={
          <div className="flex gap-1">
            <button onClick={exportBoxScoreJPG} className="bg-blue-600 text-white px-2 py-2 rounded hover:bg-blue-700 flex items-center gap-0.5 text-xs whitespace-nowrap"><Download size={13} /> JPG</button>
            {isEndGameView && <div className="relative flex-shrink-0">
            <button onClick={() => setShowDownloads(v => !v)} className="bg-gray-700 text-white px-2 py-2 rounded hover:bg-gray-600 flex items-center gap-1 text-xs whitespace-nowrap"><Download size={14} /> Downloads ▾</button>
            {showDownloads && (
              <div className={`absolute right-0 top-full mt-1 ${theme.card} border ${theme.border} rounded-lg shadow-xl z-30 min-w-52 py-1`} onMouseLeave={() => setShowDownloads(false)}>
                <button onClick={async () => { setShowDownloads(false); await exportBoxScoreJPG(); if (game.enableShotChart) await exportShotChartJPG(); if (onDownloadRotationsJPG) await onDownloadRotationsJPG(); if (onDownloadSummaryJPG) await onDownloadSummaryJPG(); exportBoxScoreCSV(); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-orange-600 hover:text-white font-semibold`}><Download size={14} /> Download All</button>
                <div className={`border-t ${theme.border} my-1`} />
                <button onClick={() => { exportBoxScoreJPG(); setShowDownloads(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-blue-600 hover:text-white`}><Download size={14} /> Box Score JPG</button>
                {game.enableShotChart && <button onClick={() => { exportShotChartJPG(); setShowDownloads(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-cyan-600 hover:text-white`}><Download size={14} /> Shot Chart JPG</button>}
                {onDownloadRotationsJPG && <button onClick={() => { onDownloadRotationsJPG(); setShowDownloads(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-teal-600 hover:text-white`}><Download size={14} /> Rotations JPG</button>}
                {onDownloadSummaryJPG && <button onClick={() => { onDownloadSummaryJPG(); setShowDownloads(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-violet-600 hover:text-white`}><Download size={14} /> Summary JPG</button>}
                <div className={`border-t ${theme.border} my-1`} />
                <button onClick={() => { exportBoxScoreCSV(); setShowDownloads(false); }} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-green-600 hover:text-white`}><Download size={14} /> Game CSV</button>
              </div>
            )}
          </div>}
          </div>
        }
      />
      <div ref={boxScoreRef} className={`${theme.card} rounded-lg shadow-lg p-4`}>
        <h2 className="text-xl font-bold mb-1 text-center">Box Score — {game.teamName} v {opponentName}</h2>
        <p className={`text-sm ${theme.textMuted} mb-4 text-center`}>{game.date} @ {game.location || 'N/A'}</p>
        <div className="flex gap-2 mb-4 flex-wrap justify-center">
          {periods.map(period => (<button key={period} onClick={() => setFilterPeriod(String(period))} className={`px-4 py-2 rounded ${filterPeriod === String(period) ? 'bg-orange-600 text-white' : darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>{getPeriodLabel(period, game.numPeriods)}</button>))}
          <button onClick={() => setFilterPeriod('Total')} className={`px-4 py-2 rounded ${filterPeriod === 'Total' ? 'bg-orange-600 text-white' : darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>Total</button>
        </div>
        <div className="overflow-x-auto">
          {(() => {
            // Pre-compute ratings for all players so we can rank them
            const allRatings = sortedPlayers.map(p => getPlayerRatings(p.originalIndex));
            const ratingEntries = allRatings.map((r, i) => ({ i, oRate: r.oRate, dRate: r.dRate }));
            const withORate = ratingEntries.filter(r => r.oRate !== null).sort((a, b) => b.oRate - a.oRate);
            const withDRate = ratingEntries.filter(r => r.dRate !== null).sort((a, b) => a.dRate - b.dRate);
            const top3OIdx = new Set(withORate.slice(0, 3).map(r => r.i));
            const bot3OIdx = new Set(withORate.slice(-3).map(r => r.i));
            const top3DIdx = new Set(withDRate.slice(0, 3).map(r => r.i));
            const bot3DIdx = new Set(withDRate.slice(-3).map(r => r.i));

                return (<div key={q}><div className={`font-bold ${q === 'A' ? 'text-green-500' : q === 'B' ? 'text-yellow-500' : 'text-red-500'}`}>Quality {q}</div><div>{qMade}/{qShots.length} ({qPct}%)</div></div>);

        const signed = (v) => v > 0 ? `+${v}` : `${v}`;
        const signColor = (v) => v > 0 ? 'text-green-500' : v < 0 ? 'text-red-500' : '';
        const getORate = (rot) => rot.offPoss > 0 ? Math.round(100 * (rot.offPoints || 0) / rot.offPoss) : '-';
        const getDRate = (rot) => rot.defPoss > 0 ? Math.round(100 * (rot.defPoints || 0) / rot.defPoss) : '-';
        const getNetRate = (rot) => {
          if (!rot.offPoss || !rot.defPoss) return '-';
          return Math.round((100 * (rot.offPoints || 0) / rot.offPoss) - (100 * (rot.defPoints || 0) / rot.defPoss));

                    <th className="p-2 text-center">REB±</th>
                    <th className="p-2 text-center">TO±</th>

                    <th className="p-2 text-center">Opp FG%</th>

                      <tr key={rot.key} className={`border-b ${theme.border} ${rowBg}`}>

                        <td className={`p-2 text-center font-bold ${signColor(rot.toDiff)}`}>{signed(rot.toDiff)}</td>

                        <td className="p-2 text-center">{fgPct(rot.oppFGMade, rot.oppFGAtt)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

                <td className="p-2 text-center">{formatShooting(opponentStats['FTMade'] || 0, opponentStats['FTMiss'] || 0)}</td>

                <td className="p-2 text-center">{opponentStats['DefReb'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['Ast'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['Stl'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['Blk'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['LiveTO'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['DeadTO'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['ForceJB'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['ConcedeJB'] || 0}</td>
                <td className="p-2 text-center">{opponentStats['Foul'] || 0}</td>
                <td className="p-2 text-center">{oppScore}</td>
